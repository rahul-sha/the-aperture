# One-shot sync from Immich to Cloudflare R2, for running on the NAS.
#
# In Dockhand: create a stack, paste this file, fill in the environment
# variables in the stack's Environment panel, and deploy. The container runs
# once, prints its progress, and exits. Deploy (run) it again whenever you
# have added or removed photos in the "Portfolio - ..." albums.
#
# IMMICH_URL must be reachable from inside Docker, so use the NAS's address,
# e.g. http://192.168.1.10:2283, rather than localhost.

services:
  photos-sync:
    build:
      context: https://github.com/rahul-sha/the-aperture.git
    restart: "no"
    environment:
      IMMICH_URL: ${IMMICH_URL}
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:-aperture-photos}
      PHOTOS_BASE_URL: ${PHOTOS_BASE_URL}
      LOCATION_GRID_KM: ${LOCATION_GRID_KM:-5}
    volumes:
      - sync-state:/state

volumes:
  sync-state:
