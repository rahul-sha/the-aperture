# Builds the Immich sync container and publishes it to GitHub's registry as
# ghcr.io/rahul-sha/the-aperture-sync, so the NAS can pull a ready image.
name: Build sync image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - scripts/**
      - content/**
      - .github/workflows/sync-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rahul-sha/the-aperture-sync:latest
            ghcr.io/rahul-sha/the-aperture-sync:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
