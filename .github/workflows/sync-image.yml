# Builds the Immich sync container and publishes it to GitHub's registry as
# ghcr.io/rahul-sha/the-aperture-sync, so the NAS can pull a ready image.
name: Build sync image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - scripts/**
      - content/**
      - .github/workflows/sync-image.yml
  # On a pull request the image is only built, never published, so a broken
  # Dockerfile shows up as a failed check before it can reach the NAS.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - scripts/**
      - content/**
      - .github/workflows/sync-image.yml
  workflow_dispatch:

# Every job may read the code; only the publish job may also write images.
permissions:
  contents: read

jobs:
  # Pull requests: build the image to catch mistakes, but never publish it.
  # This job has read-only access, so a pull request cannot push an image.
  test-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha

  # Pushes to main (and manual runs): build and publish to ghcr.io.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rahul-sha/the-aperture-sync:latest
            ghcr.io/rahul-sha/the-aperture-sync:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
