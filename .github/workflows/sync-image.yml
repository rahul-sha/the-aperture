# Builds the Immich sync container and publishes it to GitHub's registry as
# ghcr.io/rahul-sha/the-aperture-sync, so the NAS can pull a ready image.
name: Build sync image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - scripts/**
      - content/**
      - docs/sync-changelog.md
      - .github/workflows/sync-image.yml
  # On a pull request the image is only built, never published, so a broken
  # Dockerfile shows up as a failed check before it can reach the NAS.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - scripts/**
      - content/**
      - docs/sync-changelog.md
      - .github/workflows/sync-image.yml
  workflow_dispatch:

# Every job may read the code; only the publish job may also write images.
permissions:
  contents: read

jobs:
  # Pull requests: build the image to catch mistakes, but never publish it.
  # This job has read-only access, so a pull request cannot push an image.
  test-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails the check if the newest entry in docs/sync-changelog.md is mistyped.
      - name: Read the sync version
        run: echo "Sync version $(node scripts/sync-release.mjs version)"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha

  # Pushes to main (and manual runs): build and publish to ghcr.io, then
  # publish the newest notes in docs/sync-changelog.md as a GitHub Release.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the GitHub Release
      packages: write   # to publish the image
    steps:
      - uses: actions/checkout@v4
      - name: Read the sync version
        id: version
        run: echo "version=$(node scripts/sync-release.mjs version)" >> "$GITHUB_OUTPUT"
      # Labels tell Dockhand (and GitHub) where the image comes from, so the
      # release notes icon opens this repository's releases, not a guess.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rahul-sha/the-aperture-sync
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long,prefix=
          labels: |
            org.opencontainers.image.title=The Aperture photo sync
            org.opencontainers.image.description=Copies Immich albums to Cloudflare R2 for the portfolio site
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.documentation=https://github.com/rahul-sha/the-aperture/blob/main/docs/sync-changelog.md
            dockhand.changelog.url=https://github.com/rahul-sha/the-aperture/releases
          annotations: |
            org.opencontainers.image.title=The Aperture photo sync
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Only the first build of a new version makes a release; later builds of
      # the same version (a content change, say) just refresh the image.
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "sync-v$VERSION" > /dev/null 2>&1; then
            echo "Release sync-v$VERSION already exists; nothing to publish."
            exit 0
          fi
          {
            node scripts/sync-release.mjs notes
            echo
            echo "Image: \`ghcr.io/rahul-sha/the-aperture-sync:$VERSION\` (also \`latest\`). To use it, choose \"Pull + recreate\" on the Dockhand stack."
            echo
            echo "All versions: [docs/sync-changelog.md](https://github.com/rahul-sha/the-aperture/blob/main/docs/sync-changelog.md)"
          } > release-notes.md
          gh release create "sync-v$VERSION" --target "$GITHUB_SHA" \
            --title "Sync $VERSION" --notes-file release-notes.md
